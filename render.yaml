# PI2 cloud deployment: defines the public Render web service.
# Secret values are entered in Render, not written in this file.
services:
  - type: web
    name: tv-hub
    runtime: node
    plan: free
    # PI2 criterion 7: only GitHub Actions may request a deployment after successful CI.
    autoDeploy: false
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL
        value: 7d
